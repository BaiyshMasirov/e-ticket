name: eticket
description: Application for purchase e-ticket

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.7+18

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: 0.19.0

  easy_localization: 3.0.7
  get_it: ^8.0.3
  auto_route: 9.3.0+1

  flutter_bloc: ^9.0.0
  flutter_hooks: ^0.20.5
  dartz: ^0.10.1

  freezed_annotation: ^2.4.4

  dio: ^5.7.0

  flutter_svg: 2.0.17
  flutter_screenutil: ^5.9.3

  flutter_dotenv: ^5.2.1
  shimmer: ^3.0.0
  uuid: ^4.5.1

  permission_handler: ^11.3.1
  path_provider: ^2.1.5

  image_picker: ^1.1.2
  image_cropper: ^9.1.0

  tuple: ^2.0.2
  mask_text_input_formatter: ^2.5.0
  dropdown_button2: ^2.3.9

  lottie: ^3.3.1

  flutter_native_splash: ^2.4.4

  qr_flutter: ^4.1.0

  dots_indicator: ^4.0.1

  sembast: 3.8.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  mobile_scanner: 6.0.10
  zoom_widget: ^2.0.1
  url_launcher: ^6.3.1
  url_launcher_ios: ^6.3.2

  firebase_core: 3.10.1
  firebase_crashlytics: 4.3.1
  firebase_analytics: 11.4.1

  package_info_plus: 8.1.3
  webview_flutter: ^4.11.0

  local_auth: ^2.3.0
  map_launcher: ^3.5.0
  flutter_quill: 11.4.1
  upgrader: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner:

  flutter_launcher_icons: ^0.14.3

  freezed: 2.5.7
  json_serializable: 6.9.0

  auto_route_generator: 9.0.0

  flutter_gen_runner:

flutter:
  uses-material-design: true

  assets:
    - env
    - assets/images/
    - assets/images/payments/
    - assets/svgs/
    - assets/svgs/booking/
    - assets/logos/
    - assets/translations/
    - assets/lotties/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true
    lottie: true
